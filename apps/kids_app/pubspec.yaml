name: kids_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.8.1+12

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  family_api:
    path: ../../packages/family_api
  flutter:
    sdk: flutter
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  video_player: 2.10.1
  video_player_platform_interface: 6.6.0
  shared_preferences: ^2.5.3

dependency_overrides:
  video_player_android:
    path: ../../packages/video_player_android
  # 本机构建用 Dart 3.7（macOS 12 无法运行更新版本的 Dart VM）；
  # 6.7-6.9 仅收紧 SDK 元数据，本地 fork 未使用其新增接口。
  video_player_platform_interface: 6.6.0

dev_dependencies:
  flutter_secure_storage: ^10.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/douyin_icon.png
